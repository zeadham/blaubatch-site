# Netlify deploys the website from this subfolder of the repo.
# Paths below (publish, functions) are relative to `base`.
[build]
  base = "Brand Assets/blaubatch-site"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
