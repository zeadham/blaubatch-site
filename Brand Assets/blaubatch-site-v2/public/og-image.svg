      <stop offset="0%" style="stop-color:#2E7FD0;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#0D1829;stop-opacity:0"/>
    </radialGradient>
    <!-- Amber glow bottom left -->
