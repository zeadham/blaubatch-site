<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partnership Announcement — Instagram</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 40px; font-family: 'Open Sans', sans-serif; }
  .slide-label { color: #666; font-size: 14px; margin-bottom: -30px; }
  .slide { width: 1080px; height: 1080px; position: relative; overflow: hidden; display: flex; flex-direction: column; color: #fff; }

  /* ── Single Announcement Image ── */
  .announcement {
    background: radial-gradient(ellipse at 50% 40%, #23447A 0%, #141B3E 55%);
    justify-content: center; align-items: center; text-align: center;
  }

  /* Decorative rings */
  .ring { position: absolute; border: 1.5px solid rgba(43,141,208,0.12); border-radius: 50%; }
  .ring-1 { width: 600px; height: 600px; top: -100px; left: -100px; }
  .ring-2 { width: 400px; height: 400px; bottom: -80px; right: -80px; }
  .ring-3 { width: 200px; height: 200px; top: 50%; left: 50%; transform: translate(-50%, -50%); border-color: rgba(43,141,208,0.06); width: 900px; height: 900px; }

  .badge {
    display: inline-block; background: #2B8DD0; color: #fff;
    font-family: 'Open Sans', sans-serif; font-size: 15px; font-weight: 700;
    padding: 8px 24px; border-radius: 100px; letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 40px; position: relative; z-index: 1;
  }

  .logos-row {
    display: flex; align-items: center; gap: 40px; margin-bottom: 48px; position: relative; z-index: 1;
  }
  .logo-text {
    font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 56px;
    letter-spacing: 3px; text-transform: uppercase;
  }
  .logo-text.blau { color: #fff; }
  .logo-text.coraplast { color: #2B8DD0; }
  .multiply {
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 40px;
    color: rgba(255,255,255,0.3);
  }

  .accent-line { width: 120px; height: 4px; background: #2B8DD0; margin: 0 auto 40px; position: relative; z-index: 1; }

  .headline {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 36px;
    text-transform: uppercase; letter-spacing: 2px; line-height: 1.3;
    max-width: 750px; margin-bottom: 40px; position: relative; z-index: 1;
  }

  .features {
    display: flex; gap: 32px; position: relative; z-index: 1;
  }
  .feature-box {
    background: rgba(35,68,122,0.4); border: 1px solid rgba(220,220,220,0.15);
    border-radius: 12px; padding: 24px 28px; text-align: center; min-width: 180px;
  }
  .feature-box .number {
    font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 36px; color: #2B8DD0;
  }
  .feature-box .label {
    font-family: 'Open Sans', sans-serif; font-size: 16px; color: #DCDCDC; margin-top: 6px;
  }

  .footer-bar {
    position: absolute; bottom: 48px; left: 0; right: 0; text-align: center;
    font-family: 'Open Sans', sans-serif; font-size: 18px; color: rgba(255,255,255,0.4);
  }
  .footer-bar strong { color: rgba(255,255,255,0.6); }
</style>
</head>
<body>

<p class="slide-label">Single Announcement Post</p>
<div class="slide announcement">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <div class="badge">Official Announcement</div>

  <div class="logos-row">
    <div class="logo-text blau">Blau Batch</div>
    <div class="multiply">×</div>
    <div class="logo-text coraplast">Coraplast</div>
  </div>

  <div class="accent-line"></div>

  <div class="headline">Authorized Distribution<br>Partnership</div>

  <div class="features">
    <div class="feature-box">
      <div class="number">40+</div>
      <div class="label">Black MB Grades</div>
    </div>
    <div class="feature-box">
      <div class="number">75%</div>
      <div class="label">Max TiO₂</div>
    </div>
    <div class="feature-box">
      <div class="number">Custom</div>
      <div class="label">Color Matching</div>
    </div>
    <div class="feature-box">
      <div class="number">24h</div>
      <div class="label">Quote Response</div>
    </div>
  </div>

  <div class="footer-bar">
    <strong>info@blaubatch.com</strong> · wa.me/201022227723
  </div>
</div>

</body>
</html>
